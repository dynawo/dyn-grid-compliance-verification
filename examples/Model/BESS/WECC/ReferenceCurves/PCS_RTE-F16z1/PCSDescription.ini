# Tests of the DTR Fiche F16 declared with their records, as a producer delivers them.
# The tests are invented for this example: the fiche selects no test of its own, and these
# records are the tool's own simulations of setpoint steps, anonymized as measurements.
[PCS-Benchmarks]
PCS_RTE-F16z1 = PSetPointStep,QSetPointStep

[PCS-OperatingConditions]
PCS_RTE-F16z1.PSetPointStep = ConsumptionPmax,ConsumptionP50,InjectionP50,InjectionPmax
PCS_RTE-F16z1.QSetPointStep = ConsumptionPmax,ConsumptionP50,InjectionP50,InjectionPmax

[PCS_RTE-F16z1.PSetPointStep]
job_name = PCS F16-Zone1 (Battery Energy Storage Systems) - Active Setpoint Step
TSO_model = RefTracking_1Line_InfBus
Omega_model = SetPoint

[PCS_RTE-F16z1.PSetPointStep.ConsumptionPmax]
report_name = report.F16z1.DeclaredTest.tex
reference_step_size = 0.05*Pmax
bolted_fault = false
hiz_fault = false
setpoint_change_test_type = PSetpoint

[PCS_RTE-F16z1.PSetPointStep.ConsumptionPmax.Model]
SCR = 3
pdr_P = PmaxConsumption
pdr_Q = Qmin
pdr_U = Unom

[PCS_RTE-F16z1.PSetPointStep.ConsumptionPmax.Event]
connect_event_to = ActivePowerSetpointPu
sim_t_event_start = 20
setpoint_step_value = -0.05*Pmax

[PCS_RTE-F16z1.PSetPointStep.ConsumptionP50]
report_name = report.F16z1.DeclaredTest.tex
reference_step_size = 0.05*Pmax
