# Tests of the DTR Fiche F16 declared with their records, as a producer delivers them.
# The tests are invented for this example: the fiche selects no test of its own, and these
# records are the tool's own simulations of setpoint steps, anonymized as measurements.
#
# How to complete this file is explained in the chapter 'The F16 declaration file' of the
# user manual (every key, kind of test by kind of test) and in the tutorial 'Declaring the
# on-site tests of PCS F16' (docs/tutorials/f16_declaring_recorded_tests.md), step by step.
# Every test it activates is described in the chapter 'Compliance tests' of the user manual.

# One benchmark per kind of recorded test (setpoint step, fault, dip, swell, ramp, islanding)
[PCS-Benchmarks]
PCS_RTE-F16z3 = PSetPointStep,USetPointStep

# One operating condition per benchmark and active power level recorded
[PCS-OperatingConditions]
PCS_RTE-F16z3.PSetPointStep = Pmin,P50,Pmax
PCS_RTE-F16z3.USetPointStep = Pmin,P50,Pmax

# A benchmark: the grid simulated on the TSO side and the kind of event
[PCS_RTE-F16z3.PSetPointStep]
job_name = PCS F16-Zone3 (Power Park Modules) - Active Setpoint Step
TSO_model = RefTracking_1Line_InfBus
Omega_model = SetPoint

# An operating condition: how the test is reported and the control mode it needs
[PCS_RTE-F16z3.PSetPointStep.Pmin]
report_name = report.F16z3.DeclaredTest.tex
reference_step_size = 0.4*Pmax
bolted_fault = false
hiz_fault = false
setpoint_change_test_type = PSetpoint

# The grid and the operating point during the test; values follow [sign][factor*]Name
[PCS_RTE-F16z3.PSetPointStep.Pmin.Model]
line_XPu = b
pdr_P = Pmin
pdr_Q = 0
pdr_U = Udim

# The event applied, when, and its size; the record's .dict declares the same instant
[PCS_RTE-F16z3.PSetPointStep.Pmin.Event]
connect_event_to = ActivePowerSetpointPu
sim_t_event_start = 20
setpoint_step_value = +0.4*Pmax

[PCS_RTE-F16z3.PSetPointStep.P50]
report_name = report.F16z3.DeclaredTest.tex
reference_step_size = 0.4*Pmax
bolted_fault = false
hiz_fault = false
setpoint_change_test_type = PSetpoint

[PCS_RTE-F16z3.PSetPointStep.P50.Model]
line_XPu = b
pdr_P = 0.5*Pmax
pdr_Q = 0
pdr_U = Udim

[PCS_RTE-F16z3.PSetPointStep.P50.Event]
connect_event_to = ActivePowerSetpointPu
sim_t_event_start = 20
setpoint_step_value = -0.4*Pmax

[PCS_RTE-F16z3.PSetPointStep.Pmax]
report_name = report.F16z3.DeclaredTest.tex
reference_step_size = 0.4*Pmax
bolted_fault = false
hiz_fault = false
setpoint_change_test_type = PSetpoint

[PCS_RTE-F16z3.PSetPointStep.Pmax.Model]
line_XPu = b
pdr_P = Pmax
pdr_Q = 0
pdr_U = Udim

[PCS_RTE-F16z3.PSetPointStep.Pmax.Event]
connect_event_to = ActivePowerSetpointPu
sim_t_event_start = 20
setpoint_step_value = -0.4*Pmax

[PCS_RTE-F16z3.USetPointStep]
job_name = PCS F16-Zone3 (Power Park Modules) - Voltage Setpoint Step
TSO_model = RefTracking_1Line_InfBus
Omega_model = SetPoint

[PCS_RTE-F16z3.USetPointStep.Pmin]
report_name = report.F16z3.DeclaredTest.tex
reference_step_size = 0.02
bolted_fault = false
hiz_fault = false
setpoint_change_test_type = USetpoint

[PCS_RTE-F16z3.USetPointStep.Pmin.Model]
line_XPu = b
pdr_P = Pmin
pdr_Q = 0
pdr_U = Udim

[PCS_RTE-F16z3.USetPointStep.Pmin.Event]
connect_event_to = VoltageSetpointPu
sim_t_event_start = 20
setpoint_step_value = 0.02*Udim

[PCS_RTE-F16z3.USetPointStep.P50]
report_name = report.F16z3.DeclaredTest.tex
reference_step_size = 0.02
bolted_fault = false
hiz_fault = false
setpoint_change_test_type = USetpoint

[PCS_RTE-F16z3.USetPointStep.P50.Model]
line_XPu = b
pdr_P = 0.5*Pmax
pdr_Q = 0
pdr_U = Udim

[PCS_RTE-F16z3.USetPointStep.P50.Event]
connect_event_to = VoltageSetpointPu
sim_t_event_start = 20
setpoint_step_value = 0.02*Udim

[PCS_RTE-F16z3.USetPointStep.Pmax]
report_name = report.F16z3.DeclaredTest.tex
reference_step_size = 0.02
bolted_fault = false
hiz_fault = false
setpoint_change_test_type = USetpoint

[PCS_RTE-F16z3.USetPointStep.Pmax.Model]
line_XPu = b
pdr_P = Pmax
pdr_Q = 0
pdr_U = Udim

[PCS_RTE-F16z3.USetPointStep.Pmax.Event]
connect_event_to = VoltageSetpointPu
sim_t_event_start = 20
setpoint_step_value = 0.02*Udim

# The compliance tests, each one listing the benchmarks it applies to
[Model-Validations]
reaction_time = PCS_RTE-F16z3.PSetPointStep,PCS_RTE-F16z3.USetPointStep
rise_time = PCS_RTE-F16z3.PSetPointStep,PCS_RTE-F16z3.USetPointStep
response_time = PCS_RTE-F16z3.PSetPointStep,PCS_RTE-F16z3.USetPointStep
settling_time = PCS_RTE-F16z3.PSetPointStep,PCS_RTE-F16z3.USetPointStep
overshoot = PCS_RTE-F16z3.PSetPointStep,PCS_RTE-F16z3.USetPointStep
mean_absolute_error_power_1P = PCS_RTE-F16z3.PSetPointStep,PCS_RTE-F16z3.USetPointStep
mean_absolute_error_injection_1P = PCS_RTE-F16z3.PSetPointStep,PCS_RTE-F16z3.USetPointStep
mean_absolute_error_voltage = PCS_RTE-F16z3.PSetPointStep,PCS_RTE-F16z3.USetPointStep
setpoint_tracking_controlled_magnitude = PCS_RTE-F16z3.PSetPointStep,PCS_RTE-F16z3.USetPointStep

# The figures of the report, each one listing the benchmarks it is drawn for
[ReportCurves]
fig_P = PCS_RTE-F16z3.PSetPointStep,PCS_RTE-F16z3.USetPointStep
fig_Q = PCS_RTE-F16z3.PSetPointStep,PCS_RTE-F16z3.USetPointStep
fig_Ip = PCS_RTE-F16z3.PSetPointStep,PCS_RTE-F16z3.USetPointStep
fig_Iq = PCS_RTE-F16z3.PSetPointStep,PCS_RTE-F16z3.USetPointStep
fig_Ustator = PCS_RTE-F16z3.PSetPointStep,PCS_RTE-F16z3.USetPointStep
fig_V = PCS_RTE-F16z3.PSetPointStep,PCS_RTE-F16z3.USetPointStep
