[DEFAULT]
# The magnitudes below are declared at the PDR, the point where the complete installation
# connects to TSO's grid.

# p_{max_unite} injection as defined by the DTR in MW (expected value >= 0.0)
p_max_injection = 75
# p_{max_unite} consumption as defined by the DTR in MW (only for BESS, expected value >= 0.0).
p_max_consumption = 75
# u_nom is the nominal voltage of that bus (in kV)
# Allowed values: 400, 225, 150, 90, 63 (land) and 132, 66 (offshore)
u_nom = 225
# q_max is the maximum reactive power (in MVar)
q_max = 40
# q_min is the minimum reactive power (in MVar)
q_min = -40
# topology
topology = S+Aux
# Generator type in the original network (SM, PPM or BESS)
generator_type = BESS
