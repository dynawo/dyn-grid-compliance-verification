[DEFAULT]
# The magnitudes below are declared at the PDR, the point where the complete installation
# connects to TSO's grid. They give the type of the installation, which decides whether the
# DTR Fiche I18 applies (types C and D), and the limits of the PGU unless [GFM Parameters]
# declares its own.

# Kind of unit, which decides the Grid Forming tests it is given: BESS (the DTR Fiche I18)
# or PPM
generator_type = BESS

# p_{max_unite} injection as defined by the DTR in MW (expected value >= 0.0)
p_max_injection = 110
# p_{min_unite} injection in MW
p_min_injection = -110
# u_nom is the nominal voltage of the PDR bus (in kV)
# Allowed values: 400, 225, 150, 90, 63 (land) and 132, 66 (offshore)
u_nom = 225
# q_max is the maximum reactive power of the installation (in MVar)
q_max = 40
# q_min is the minimum reactive power of the installation (in MVar)
q_min = -40

[GFM Parameters]
# The converter the Grid Forming tests are run on, the PGU, at its terminals: the envelopes of
# `dycov generate_gfm_envelopes` and of the performance verification are generated from it.
# Its p_max_injection, p_max_consumption, q_max and q_min go here too when they differ from
# those of the installation.

# Nominal apparent power (Warning: if you run Dynawo simulations, DyCoV will use the Snom specified in the PAR file, not this one) 
Snom = 90.0

# The DTR Fiche I18 fixes the inertia constant, H = 5 s (TR = 10 s), whatever this file says,
# so the examples declare that value, and a damping factor that gives the response its regime
# with it
# Damping factor, high enough for an overdamped response over the variations of the tests
D = 280.0

# Inertia constant (in s)
H = 5.0

# Effective reactance (in pu of Snom). The DTR Fiche I18 fixes 0.27 pu and uses this one only
# when higher
Xeff = 0.27

# Define EMT delay
emt_delay = 0.02