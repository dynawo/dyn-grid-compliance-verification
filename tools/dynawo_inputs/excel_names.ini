# Every name the generator looks for in the workbook, so a renamed sheet, row or header is a
# change here and not in the code. Values are matched without accents and case-insensitively, and
# the header ones by substring, so "Paramètres" also matches "Parametres (unité)".
#
# {gen} in a curve name stands for the generator block id, which follows the technology
# (Wind_Turbine, PV_Array, Bess).

[Sheets]
config = Général
model_map = Model Map
zone1 = Zone1a
zone3 = Zone3
# Sheets whose name is a prefix, since a plant may describe several zones 1 (Zone1a, Zone1b…).
zone1_prefix = Zone1
signals_zone1 = Signaux zone 1
signals_zone3 = Signaux zone 3

[Anchors]
# Comma-separated alternatives: the readers accept any of them, so a template that spells a
# header differently needs no code change. The parameter header also matches with a suffix,
# as in "Paramètres (Dynawo)".
param = Paramètres, Parameter
type = Type, Types
value = Valeurs, Values, Valeur, Value
base_unit = Base unit, Base
comment = Comment, Commentaires
# Général and Model Map: the derived table is anchored on this header, and the Model-Map key is
# the column immediately to its left, so the key's own header is free.
model_map = Zone3 lib
block = Type de bloc
choice = Choix
zone = Zone
# Signal sheets: the signals table, the tests table, and the folder holding the .csv files.
signal_label = Grandeur
signal_column = Variable associée
test_case = Cas
test_fiche = Fiche
test_file = Fichier de résultats
curves_folder = Dossier de résultats

[Markers]
# A parameter that does not apply to a variant, in its name or its value cell.
not_applicable = /
# Choices that mean "no block selected".
no_block = Aucun, none, n/a, na, -
# Same idea in a base-unit or comment cell: the row has no annotation to carry.
no_annotation = -, /, n/a, na
# Base unit that depends on the side the converter controls on.
converter_voltage = Un1 ou Un2

[Zone1-Rows]
s_nom = SnZone1
converter_lv_control = ConverterLVControl
u_nom = Un1
group_impedance = Z_cc_TG
group_rx_ratio = R_cc_TG / X_cc_TG
group_ratio = r_TG
p_max_injection = Pmax_injection_z1
p_max_consumption = Pmax_soutirage_z1
q_max = Qmax_z1
q_min = Qmin_z1
p_sharing = P_share
q_sharing = Q_share

[Zone3-Rows]
s_nom = SnZone3
topology = Topologie
u_nom = Un_PDR
p_max_injection = Pmax_injection_PDR
p_max_consumption = Pmax_soutirage_PDR
q_max = Qmax_PDR
q_min = Qmin_PDR
main_impedance = Z_cc_TP
main_rx_ratio = R_cc_TP / X_cc_TP
taps = N_prises
tap_ratio_min = r_min
tap_ratio_max = r_max
starting_tap = Tap_0
starting_ratio = r_0
aux_s_nom = Sn_A
aux_ratio = r_TA
aux_impedance = Z_cc_TA
aux_rx_ratio = R_cc_TA / X_cc_TA
aux_p = P_A
aux_q = Q_A
aux_alpha = alpha
aux_beta = beta
collector_r = R_rc
collector_x = X_rc
collector_b = B_rc
collector_g = G_rc

[Zone1-Curves]
# Row of the signals table = the curve DyCoV reads from the reference .csv. A row with no curve
# is informative only: DyCoV never reads it.
Tension directe (RMS) au nœud 1 = InternalNode1_BUS_Voltage
Tension directe (RMS) au nœud 2 = {gen}_GEN_UPuInjTerminal
Puissance active injectée par le convertisseur à son point de contrôle au nœud 1 =
    InternalNode1_BUS_ActivePower
Puissance réactive injectée par le convertisseur à son point de contrôle au nœud 1 =
    InternalNode1_BUS_ReactivePower
Courant actif direct injecté au nœud 1 = InternalNode1_BUS_ActiveCurrent
Courant réactif direct injecté au nœud 1 = InternalNode1_BUS_ReactiveCurrent
Courant actif direct injecté au nœud 2 = {gen}_GEN_IpInjTerminal
Courant réactif direct injecté au nœud 2 = {gen}_GEN_IqInjTerminal

[Zone3-Curves]
Tension directe au PDR = BusPDR_BUS_Voltage
Puissance active injectée au PDR = BusPDR_BUS_ActivePower
Puissance réactive injectée au PDR = BusPDR_BUS_ReactivePower
Courant actif direct injecté au PDR = BusPDR_BUS_ActiveCurrent
Courant réactif direct injecté au PDR = BusPDR_BUS_ReactiveCurrent
Grandeur contrôlée par le réglage primaire de tension (U + lambda*Q mesuré) =
    {gen}_GEN_MagnitudeControlledByAVRPu
Consigne du réglage primaire de tension “U+lambda.Q” = {gen}_GEN_VoltageSetpointPu
Prise du régleur du TP = Main_Xfmr_XFMR_Tap
Fréquence = NetworkFrequencyPu

[Zone1-Tests]
# DTR case number (the 'Cas' column) = the DyCoV PCS.Benchmark.OperatingCondition it runs as.
# Case 14 (frequency ramp) does not apply to Zone 1, so it names no test.
6 = PCS_RTE-I16z1.ThreePhaseFault.TransientBoltedSCR3
7 = PCS_RTE-I16z1.ThreePhaseFault.TransientBoltedSCR10
8 = PCS_RTE-I16z1.ThreePhaseFault.TransientBoltedSCR3Qmin
9 = PCS_RTE-I16z1.ThreePhaseFault.TransientHiZTc800
10 = PCS_RTE-I16z1.ThreePhaseFault.TransientHiZTc500
13 = PCS_RTE-I16z1.SetPointStep.Active
15 = PCS_RTE-I16z1.SetPointStep.Voltage
16 = PCS_RTE-I16z1.SetPointStep.Reactive
17 = PCS_RTE-I16z1.GridVoltageStep.Rise
18 = PCS_RTE-I16z1.GridVoltageStep.Drop
23 = PCS_RTE-I16z1.ThreePhaseFault.PermanentHiZ
24 = PCS_RTE-I16z1.ThreePhaseFault.PermanentBolted

[Zone3-Tests]
# DTR sheet (the 'Fiche' column) and its position among the rows of that same sheet, since a
# sheet covers several operating conditions: I2/1 is the first I2 row, I2/2 the second, and so on.
I2/1 = PCS_RTE-I16z3.USetPointStep.AReactance
I2/2 = PCS_RTE-I16z3.USetPointStep.BReactance
I2/3 = PCS_RTE-I16z3.PSetPointStep.Dec40
I2/4 = PCS_RTE-I16z3.PSetPointStep.Inc40
I2/5 = PCS_RTE-I16z3.QSetPointStep.Inc10
I2/6 = PCS_RTE-I16z3.QSetPointStep.Dec20
I5/1 = PCS_RTE-I16z3.ThreePhaseFault.TransientBolted
I6/1 = PCS_RTE-I16z3.GridVoltageDip.Qzero
I7/1 = PCS_RTE-I16z3.GridVoltageSwell.QMin
I7/2 = PCS_RTE-I16z3.GridVoltageSwell.QMax
I10/1 = PCS_RTE-I16z3.Islanding.DeltaP10DeltaQ4
