# The values the inputs of the example curve directories need and their models do not state.
# tools/scripts/example_inputs.py reads them from here; nothing is deduced.

# The apparent power each producer of curves declares, per zone, in MVA. A delivery of curves
# has no model to read it from, so it is written into the declaration. These are the values the
# examples ship with; their models declare the same in WT_SNom, WPP_SNom and BESS_SNom.
[Producer.PPM]
Zone1.s_nom = 4
Zone3.s_nom = 90

[Producer.BESS]
Zone1.s_nom = 0.5
Zone3.s_nom = 60

# The maximum injected current of the generator, in pu. No curve carries it and the anonymizer
# does not write it, but the fault test of the performance fiches checks the reactive current
# against it, and finds nothing without it. One section per kind of producer: the name the
# curves give the generator, the value — the same their models declare in WPP_IMaxPu and
# BESS_IMaxPu — and the tests that read it. A producer with no section, a synchronous machine
# whose fiche does not check it, gets none.
[Imax.PPM]
generator = Wind_Turbine
value = 1.3
tests = PCS_RTE-I5.ThreePhaseFault.TransientBolted

[Imax.BESS]
generator = Bess
value = 1.3
tests = PCS_RTE-I5.ThreePhaseFault.TransientBoltedInjection,
    PCS_RTE-I5.ThreePhaseFault.TransientBoltedConsumption

# The on-site tests of the DTR Fiche F16 the examples declare as recorded. The fiche selects no
# test of its own, so a producer chooses them, and the choice is the same for every example: a
# setpoint step of active power and one of voltage, at each power level the producer records.
# One key per level: its name, then the active power at the PDR and the step of the active
# power test. The voltage test always steps 0.02*Udim, whatever the level.
[F16.PPM]
label = Power Park Modules
Pmin = Pmin, +0.4*Pmax
P50 = 0.5*Pmax, -0.4*Pmax
Pmax = Pmax, -0.4*Pmax

[F16.BESS]
label = Battery Energy Storage Systems
ConsumptionPmax = PmaxConsumption, -0.4*Pmax
ConsumptionP50 = 0.5*PmaxConsumption, -0.4*Pmax
InjectionP50 = 0.5*PmaxInjection, -0.4*Pmax
InjectionPmax = PmaxInjection, -0.4*Pmax
