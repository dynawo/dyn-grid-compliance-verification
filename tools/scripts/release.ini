# The configuration the curve regeneration runs with, so that the curves a release ships do
# not depend on the machine that produced them: every value takes its default, and the lists
# below stay empty on purpose, because any PCS selection would leave curves out of the release.
# The revision of the DTR has no default, so it is set here: the curves a release ships follow
# the newest revision the release implements.

[DTR]
current = 20260723

[Global]
electric_performance_verification_pcs =
electric_performance_ppm_verification_pcs =
electric_performance_bess_verification_pcs =
model_ppm_validation_pcs =
model_bess_validation_pcs =
