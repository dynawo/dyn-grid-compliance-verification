MinActivePowerPu = BESS_PMinREECPu # base SNom
MaxReactivePowerPu = BESS_QMaxREECPu # base SNom
MinReactivePowerPu = BESS_QMinREECPu # base SNom
FreqFlag = BESS_FreqFlag
RefFlag = BESS_RefFlag
VCompFlag = BESS_VCompFlag
