[GridFormingConverterDroopControl]
family = GFM
ActivePower0Pu = converter_P0Pu # base SnRef
ReactivePower0Pu = converter_Q0Pu # base SnRef
Voltage0Pu = converter_U0Pu # base UNom
Phase0 = converter_UPhase0
# The transformer of the unit is inside the model, which gives the power on its converter side in
# the base of the unit and the voltage there in its own frame: the curves of Node2 are read at
# its terminal, the grid side of that transformer, as those of the IEC plant models of zone 3
ActivePowerNode2 = converter_PGenPu # base SnRef, UNom
ReactivePowerNode2 = converter_QGenPu # base SnRef, UNom
ActivePowerControlledNode = converter_PGenPu # base SnRef
ReactivePowerControlledNode = converter_QGenPu # base SnRef
VoltageNode2 = converter_UPu # base UNom
ActivePowerSetpointPu = control_PRefPu # base SNom
ReactivePowerSetpointPu = control_QRefPu # base SNom
VoltageSetpointPu = control_UFilterRefPu # base UNom
NetworkFrequencyPu = converter_omegaPu # base omegaNom
NetworkFrequencyReference = control_omegaRefPu # base omegaNom
MaxCurrentAtConverter = control_IMaxVI # base UNom, SNom
NominalApparentPower = converter_SNom
FrequencyDroop = control_Mp
# The converter reaches its terminal through its own transformer, which no parameter switches off
ConverterLVControl = false
# Its references are taken at the filter capacitor, on the converter side of that transformer
SetpointsBehindTransformer = true
TransformerResistance = converter_RTransformer # base UNom, SNom
TransformerReactance = converter_LTransformer # base UNom, SNom

[GridFormingEpri]
family = GFM
ActivePower0Pu = gfm_P0Pu # base SnRef
ReactivePower0Pu = gfm_Q0Pu # base SnRef
Voltage0Pu = gfm_U0Pu # base UNom
Phase0 = gfm_Theta0
ActivePowerNode2 = gfm_measurements_PPuSnRef # base SnRef, UNom
ReactivePowerNode2 = gfm_measurements_QPuSnRef # base SnRef, UNom
ActivePowerControlledNode = gfm_measurements_PPuSnRef # base SnRef
ReactivePowerControlledNode = gfm_measurements_QPuSnRef # base SnRef
VoltageNode2 = gfm_measurements_UPu # base UNom
ActivePowerSetpointPu = gfm_PRefPu # base SNom
ReactivePowerSetpointPu = gfm_QRefPu # base SNom
VoltageSetpointPu = gfm_URefPu # base UNom
VoltageControlledNode = gfm_measurements_UPu # base UNom
NetworkFrequencyPu = gfm_gfm_omegaPu # base omegaNom
MaxCurrentAtConverter = gfm_IMaxPu # base UNom, SNom
NominalApparentPower = gfm_SNom
FrequencyDroop = gfm_OmegaDroopPu
# The converter reaches its terminal through the source impedance of its model, which no parameter
# switches off
ConverterLVControl = false
