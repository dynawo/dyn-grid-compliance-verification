ReactivePower0Pu = BESS_Q0Pu # base SnRef
Voltage0Pu = BESS_U0Pu # base UNom
Phase0 = BESS_UPhase0
MaxActivePowerPu = BESS_PMaxREECPu # base SNom
MinActivePowerPu = BESS_PMinREECPu # base SNom
MaxReactivePowerPu = BESS_QMaxREECPu # base SNom
MinReactivePowerPu = BESS_QMinREECPu # base SNom
QFlag = BESS_QFlag
VFlag = BESS_VFlag
PfFlag = BESS_PfFlag
PFlag = BESS_PQFlag
ActivePowerNode2 = BESS_injector_PInjPu # base SnRef, UNom
ReactivePowerNode2 = BESS_injector_QInjPu # base SnRef, UNom
ActivePowerControlledNode = BESS_LvMeasurements_PPuSnRef # base SnRef
ReactivePowerControlledNode = BESS_LvMeasurements_QPuSnRef # base SnRef
VoltageNode2 = BESS_injector_UPu # base UNom
