[PCS_RTE-IGFM3]
# DTR Fiche I18 (Grid Forming), Test 3, short-circuit ratio jump
# PCS Id, Used to sort the final report
id = 9999
# Report name
report_name = report.RTE-IGFM3.tex

# Common parameters
# Minimum ratio for parameter variations
RatioMin = 0.85
# Maximum ratio for parameter variations
RatioMax = 1.15
# PmaxMOIS tunnel param
PmaxMOISTunnel = 0.95
# PminMOIS tunnel param
PminMOISTunnel = -0.95
# Base angular frequency (radians/second)
Wb = 314
# Grid RMS voltage (pu)
Ugr = 1.0
# Upper margin for power envelopes
MarginHigh = 0.3
# Lower margin for power envelopes
MarginLow = 0.5
# Parameter for tunnel function
FinalAllowedTunnelVariation = 0.05
# Parameter for tunnel function: the final band of the DTR Fiche I18, 5 % of the nominal current
FinalAllowedTunnelPn = 0.05

[PCS-Benchmarks]
PCS_RTE-IGFM3 = S_SCRup1,S_SCRdown1

[PCS-OperatingConditions]
PCS_RTE-IGFM3.S_SCRup1 = OC1,OC2,OC3,OC4,OC5
PCS_RTE-IGFM3.S_SCRdown1 = OC1,OC2,OC3,OC4,OC5

[PCS_RTE-IGFM3.S_SCRup1]
calculator = SCRJump
SCRinitial = 2
SCRfinal = 20

[PCS_RTE-IGFM3.S_SCRup1.OC1]
inherit = PlantOC1

[PCS_RTE-IGFM3.S_SCRup1.OC2]
inherit = PlantOC2

[PCS_RTE-IGFM3.S_SCRup1.OC3]
inherit = PlantOC3

[PCS_RTE-IGFM3.S_SCRup1.OC4]
inherit = PlantOC4

[PCS_RTE-IGFM3.S_SCRup1.OC5]
inherit = PlantOC5

[PCS_RTE-IGFM3.S_SCRdown1]
calculator = SCRJump
SCRinitial = 20
SCRfinal = 2

[PCS_RTE-IGFM3.S_SCRdown1.OC1]
inherit = PlantOC1

[PCS_RTE-IGFM3.S_SCRdown1.OC2]
inherit = PlantOC2

[PCS_RTE-IGFM3.S_SCRdown1.OC3]
inherit = PlantOC3

[PCS_RTE-IGFM3.S_SCRdown1.OC4]
inherit = PlantOC4

[PCS_RTE-IGFM3.S_SCRdown1.OC5]
inherit = PlantOC5
