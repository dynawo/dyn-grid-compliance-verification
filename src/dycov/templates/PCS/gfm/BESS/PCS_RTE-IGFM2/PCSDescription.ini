[PCS_RTE-IGFM2]
# DTR Fiche I18 (Grid Forming), Test 2, amplitude step of the voltage at the infinite bus
# PCS Id, Used to sort the final report
id = 9999
# Report name
report_name = report.RTE-IGFM2.tex

# Common parameters
# Upper margin for power envelopes
MarginHigh = 0.3
# Parameter for tunnel function
FinalAllowedTunnelVariation = 0.05
# Parameter for tunnel function: the final band of the DTR Fiche I18, 5 % of the nominal current
FinalAllowedTunnelPn = 0.05
# Time to 90%
TimeTo90 = 0.01
# Time for tunnel
TimeforTunnel = 0.08

[PCS-Benchmarks]
PCS_RTE-IGFM2 = S_VolAmpStep1,S_VolAmpStep2,S_VolAmpStep3,S_VolAmpStep4,S_VolAmpStep5,S_VolAmpStep6

[PCS-OperatingConditions]
PCS_RTE-IGFM2.S_VolAmpStep1 = OC1,OC2,OC3,OC4,OC5,OC6,OC7
PCS_RTE-IGFM2.S_VolAmpStep2 = OC1,OC2,OC3,OC4,OC5,OC6,OC7
PCS_RTE-IGFM2.S_VolAmpStep3 = OC1,OC2,OC3,OC4,OC5,OC6,OC7
PCS_RTE-IGFM2.S_VolAmpStep4 = OC1,OC2,OC3,OC4,OC5,OC6,OC7
