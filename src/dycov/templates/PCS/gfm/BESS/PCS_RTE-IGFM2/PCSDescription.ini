PCS_RTE-IGFM2.S_VolAmpStep6 = OC1,OC2,OC3,OC4,OC5,OC6,OC7

[PCS_RTE-IGFM2.S_VolAmpStep1]
calculator = AmplitudeStep
VoltageStepAtGrid = 0.15*(Xeff+Xgrid)
SCR = SCRmin

