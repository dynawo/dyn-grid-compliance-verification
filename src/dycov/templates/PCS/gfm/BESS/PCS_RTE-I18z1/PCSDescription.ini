[PCS_RTE-I18z1]
# DTR Fiche I18 (Grid Forming), for the non-synchronous storage units of type C and D. Its
# tests 1 to 4 are checked against envelopes; test 5, the faults, is for information only in the
# fiche and has none
# PCS Id, used to sort the final report
id = 18
# PCS Zone: the tests are run at the PGU terminals, the Node 1 of the Zone 1 of the DTR
zone = 1
# Report name
report_name = report.RTE-I18z1.tex

# Common parameters, the settings of each test being in the alias file
# Parameter for tunnel function
FinalAllowedTunnelVariation = 0.05
# Parameter for tunnel function: the final band of the DTR Fiche I18, 5 % of the nominal current
FinalAllowedTunnelPn = 0.05

[PCS-Benchmarks]
PCS_RTE-I18z1 = S_VolAngStep1,S_VolAngStep2,S_VolAngStep3,S_VolAngStep4,S_VolAngStep5,S_VolAngStep6,S_VolAngStep7,S_VolAngStep8,S_VolAngStep9,S_VolAngStep10,S_VolAngStep11,S_VolAngStep12,S_VolAmpStep1,S_VolAmpStep2,S_VolAmpStep3,S_VolAmpStep4,S_VolAmpStep5,S_VolAmpStep6,S_SCRup1,S_SCRdown1,S_Rocof1,S_Rocof2,S_Rocof3,S_Rocof4,S_Rocof5,S_Rocof6,S_Rocof7,S_Rocof8,S_Rocof9,S_Rocof10,S_Rocof11,S_Rocof12

