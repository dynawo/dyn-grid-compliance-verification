[PCS_RTE-IGFM1]
# DTR Fiche I18 (Grid Forming), Test 1, phase jump of the voltage at the infinite bus
# PCS Id, Used to sort the final report
id = 9999
# Report name
report_name = report.RTE-IGFM1.tex

# Common parameters
# Minimum ratio for parameter variations
RatioMin = 0.9
# Maximum ratio for parameter variations
RatioMax = 1.1
# PmaxMOIS tunnel param
PmaxMOISTunnel = 0.95
# PminMOIS tunnel param
PminMOISTunnel = -0.95
# Base angular frequency (radians/second)
Wb = 314
# Grid RMS voltage (pu)
Ugr = 1.0
# Upper margin for power envelopes
MarginHigh = 0.5
# Lower margin for power envelopes
MarginLow = 0.5
# Parameter for tunnel function
FinalAllowedTunnelVariation = 0.05
# Parameter for tunnel function: the final band of the DTR Fiche I18, 5 % of the nominal current
FinalAllowedTunnelPn = 0.05

[PCS-Benchmarks]
PCS_RTE-IGFM1 = S_VolAngStep1,S_VolAngStep2,S_VolAngStep3,S_VolAngStep4,S_VolAngStep5,S_VolAngStep6,S_VolAngStep7,S_VolAngStep8,S_VolAngStep9,S_VolAngStep10,S_VolAngStep11,S_VolAngStep12

[PCS-OperatingConditions]
PCS_RTE-IGFM1.S_VolAngStep1 = OC1,OC2,OC3,OC4,OC5
PCS_RTE-IGFM1.S_VolAngStep2 = OC1,OC2,OC3,OC4,OC5
PCS_RTE-IGFM1.S_VolAngStep3 = OC1,OC2,OC3,OC4,OC5
