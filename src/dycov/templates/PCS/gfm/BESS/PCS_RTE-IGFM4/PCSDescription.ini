[PCS_RTE-IGFM4]
# DTR Fiche I18 (Grid Forming), Test 4, frequency variation (RoCoF)
# PCS Id, Used to sort the final report
id = 9999
# Report name
report_name = report.RTE-IGFM4.tex

# Common parameters
# Minimum ratio for parameter variations
RatioMin = 0.8
# Maximum ratio for parameter variations
RatioMax = 1.2
# PmaxMOIS tunnel param
PmaxMOISTunnel = 0.98
# PminMOIS tunnel param
PminMOISTunnel = -0.98
# Base angular frequency (radians/second)
Wb = 314
# Grid RMS voltage (pu)
Ugr = 1.0
# Upper margin for power envelopes
MarginHigh = 0.3
# Lower margin for power envelopes
MarginLow = 0.5
# Parameter for tunnel function
FinalAllowedTunnelVariation = 0.05
# Parameter for tunnel function: the final band of the DTR Fiche I18, 5 % of the nominal current
FinalAllowedTunnelPn = 0.05
# Exponential decrease time constant
TimeExponentialDecrease = 0.3
# PLL time constant
Tpll = 0.01

[PCS-Benchmarks]
PCS_RTE-IGFM4 = S_Rocof1,S_Rocof2,S_Rocof3,S_Rocof4,S_Rocof5,S_Rocof6,S_Rocof7,S_Rocof8,S_Rocof9,S_Rocof10,S_Rocof11,S_Rocof12

[PCS-OperatingConditions]
PCS_RTE-IGFM4.S_Rocof1 = OC1,OC2,OC3,OC4,OC5
PCS_RTE-IGFM4.S_Rocof2 = OC1,OC2,OC3,OC4,OC5
