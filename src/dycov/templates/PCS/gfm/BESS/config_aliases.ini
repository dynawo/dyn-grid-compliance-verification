# Aliases of the DTR Fiche I18 (Grid Forming): the settings of each of its tests, which the
# scenarios of the test inherit, and its operating points, all of them taken at the PGU
# terminals. The fiche gives the operating points in pu of the rating of the converter (its
# Snom), as its example envelopes show: P0 = 0.5 pu in OC2 for a unit of 100 MVA and 120 MW.
#
# There are three ways to define a PCS configuration section:
#
# 1. Standard definition (no inheritance):
#    All parameters are defined directly.
#    [MySection]
#    P0 = 0.5
#    Q0 = 0
#
# 2. Full inheritance:
#    The section only contains the 'inherit' key. All values are
#    loaded from the specified alias section.
#    [MySection]
#    inherit = MyAlias
#
# 3. Inheritance with override:
#    The section inherits from an alias but also defines specific
#    parameters. These local parameters will override the inherited ones.
#    [MySection]
#    inherit = MyAlias
#    Q0 = 0.1  # This value overrides Q0 from MyAlias

[PhaseJumpTest]
# Test 1, phase jump of the voltage at the infinite bus
calculator = PhaseJump
# Minimum ratio for parameter variations
RatioMin = 0.9
# Maximum ratio for parameter variations
RatioMax = 1.1
# PmaxMOIS tunnel param
PmaxMOISTunnel = 0.95
# PminMOIS tunnel param
PminMOISTunnel = -0.95
# Base angular frequency (radians/second)
Wb = 314
# Grid RMS voltage (pu)
Ugr = 1.0
# Upper margin for power envelopes
MarginHigh = 0.5
# Lower margin for power envelopes
MarginLow = 0.5

[AmplitudeStepTest]
# Test 2, amplitude step of the voltage at the infinite bus
calculator = AmplitudeStep
# Upper margin for power envelopes
MarginHigh = 0.3
# Time to 90%
TimeTo90 = 0.01
# Time for tunnel
TimeforTunnel = 0.08

[SCRJumpTest]
# Test 3, short-circuit ratio jump
calculator = SCRJump
# Minimum ratio for parameter variations
RatioMin = 0.85
# Maximum ratio for parameter variations
RatioMax = 1.15
# PmaxMOIS tunnel param
PmaxMOISTunnel = 0.95
# PminMOIS tunnel param
PminMOISTunnel = -0.95
# Base angular frequency (radians/second)
Wb = 314
# Grid RMS voltage (pu)
Ugr = 1.0
# Upper margin for power envelopes
MarginHigh = 0.3
# Lower margin for power envelopes
MarginLow = 0.5

[RoCoFTest]
# Test 4, frequency variation (RoCoF)
calculator = RoCoF
# Minimum ratio for parameter variations
RatioMin = 0.8
# Maximum ratio for parameter variations
RatioMax = 1.2
# PmaxMOIS tunnel param
PmaxMOISTunnel = 0.98
# PminMOIS tunnel param
PminMOISTunnel = -0.98
# Base angular frequency (radians/second)
Wb = 314
# Grid RMS voltage (pu)
Ugr = 1.0
# Upper margin for power envelopes
MarginHigh = 0.3
# Lower margin for power envelopes
MarginLow = 0.5
# Exponential decrease time constant
TimeExponentialDecrease = 0.3
# PLL time constant
Tpll = 0.01

[PlantOC1]
# Description: P=0, Q=0
P0 = 0
Q0 = 0
U0 = 1
SoCBattery = 0.5

[PlantOC2]
# Description: P=0.5 Pn, Q=0
P0 = 0.5
Q0 = 0
U0 = 1
SoCBattery = 0.5

[PlantOC3]
# Description: P=-0.5 Pn, Q=0
P0 = -0.5
Q0 = 0
U0 = 1
SoCBattery = 0.5

[PlantOC4]
# Description: P=0.95 Pn, Q=0
P0 = 0.95
Q0 = 0
U0 = 1
SoCBattery = 0.5

[PlantOC5]
# Description: P=-0.95 Pn, Q=0
P0 = -0.95
Q0 = 0
U0 = 1
SoCBattery = 0.5

[PlantOC6]
# Description: P=0, Q=-Qmax (absorption). The DTR gives 0.3 Pn as the order of magnitude of
# Qmax, the value used is the one the producer declares
P0 = 0
Q0 = -Qmax
U0 = 1
SoCBattery = 0.5

[PlantOC7]
# Description: P=0, Q=Qmax (injection). The DTR gives 0.3 Pn as the order of magnitude of
# Qmax, the value used is the one the producer declares
P0 = 0
Q0 = Qmax
U0 = 1
SoCBattery = 0.5
