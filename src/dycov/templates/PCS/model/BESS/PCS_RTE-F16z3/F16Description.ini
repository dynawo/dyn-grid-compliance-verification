# Tests of the DTR Fiche F16 declared with their records, as a producer delivers them.
# Copy this file next to the reference curves of the case, as <ReferenceCurves>/F16Description.ini,
# and complete it: one benchmark per kind of recorded test, one operating condition per active
# power level the fiche fixes, the grid and the event of each one, and the compliance tests and
# figures of each benchmark. The empty values are the ones the producer fills.
#
# How to complete it is explained in the chapter 'The F16 declaration file' of the user manual
# (every key, kind of test by kind of test: setpoint step, three-phase fault, voltage dip,
# voltage swell, frequency ramp, islanding) and in the tutorial 'Declaring the on-site tests of
# PCS F16' (docs/tutorials/f16_declaring_recorded_tests.md), step by step. Every test it
# activates is described in the chapter 'Compliance tests' of the user manual.

[PCS-Benchmarks]
PCS_RTE-F16z3 = RecordedTest

[PCS-OperatingConditions]
PCS_RTE-F16z3.RecordedTest = ConsumptionPmax,ConsumptionP50,InjectionP50,InjectionPmax

[PCS_RTE-F16z3.RecordedTest]
# Job name to apply in the JOBS file
job_name = PCS F16-Zone3 (Battery Energy Storage Systems) - Recorded test
# TSO model side
TSO_model = RefTracking_1Line_InfBus
# Omega model
Omega_model = SetPoint

[PCS_RTE-F16z3.RecordedTest.ConsumptionPmax]
# Every declared test is reported with the same template
report_name = report.F16z3.DeclaredTest.tex
# Tolerance for reference tracking tests should be adapted to the magnitude of the step change
reference_step_size =
# Is this a bolted fault OC?
bolted_fault = false
# Is this a Hi-Z fault OC?
hiz_fault = false
# OperatingCondition type: PSetpoint, QSetpoint, USetpoint or Others
setpoint_change_test_type =

[PCS_RTE-F16z3.RecordedTest.ConsumptionPmax.Model]
# The grid during the test: the reactance of the line to the PDR, in pu (line_XPu),
# or the short-circuit impedance seen from the PDR (Zcc)
line_XPu =
# PDR point: the active power level the DTR fixes, and the recorded Q and U
pdr_P = PmaxConsumption
pdr_Q =
pdr_U =

[PCS_RTE-F16z3.RecordedTest.ConsumptionPmax.Event]
# Event connected to setpoint magnitude
connect_event_to =
# Instant of time at which the event starts
sim_t_event_start =
# Duration of the event or fault
#fault_duration =
# Event setpoint step value
setpoint_step_value =

[PCS_RTE-F16z3.RecordedTest.ConsumptionP50]
# Every declared test is reported with the same template
