# Fiche I16.2 of the DTR, the version of the Fiche I16 for the storage installations of types C
# and D, which the INI file of Zone 3 declares with installation_type. It patches the description
# next to it, the version for type B (Fiche I16.1): every section and key it leaves out is that of
# type B.

[PCS_RTE-I16z3]
# Report name
report_name = report.RTE-I16z3.TypeCD.tex

[GridCode]
# The fiche asks for a cut-off frequency of 30 Hz, given the response dynamics of Grid Forming
# units, and advises a common sampling interval of 1 ms
cutoff = 30.0
t_com = 0.001

[PCS-Benchmarks]
# The fault of the Fiche I5 is not a test of this version
PCS_RTE-I16z3 = USetPointStep,PSetPointStep,QSetPointStep,GridVoltageDip,GridVoltageSwell,GridFreqRamp,Islanding
