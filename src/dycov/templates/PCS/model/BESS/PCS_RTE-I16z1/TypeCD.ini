# Fiche I16.2 of the DTR, the version of the Fiche I16 for the storage installations of types C
# and D, which the INI file of Zone 3 declares with installation_type. It patches the description
# next to it, the version for type B (Fiche I16.1): every section and key it leaves out is that of
# type B.
#
# Zone 1 keeps the setpoint steps of type B, run with a grid of short-circuit ratio 2, and adds the
# tests of the Fiche I18 (Grid Forming), simulated as its tables define them: their names are those
# of the scenarios of that fiche, and the settings they share are the I18 aliases of the
# config_aliases.ini of this directory's parent. Every test of the Fiche I18 is run for OC2 and
# OC3; the fiche asks for the others only when they drive the unit into current limitation, which
# the producer shows by delivering their reference curves, so each of them is run when its
# reference curve is there (only_with_reference).

[PCS_RTE-I16z1]
# Report name
report_name = report.RTE-I16z1.TypeCD.tex

[GridCode]
# The fiche asks for a cut-off frequency of 30 Hz, given the response dynamics of Grid Forming
# units, and advises a common sampling interval of 1 ms
cutoff = 30.0
t_com = 0.001

[Dynawo]
# A Grid Forming unit answers a jump of the phase or of the voltage of the grid within a few
# milliseconds, which the 20 ms transition of type B would smear: the tables of the grid make it
# in 2 ms, which the solver still follows
transition_half_width = 0.001

[PCS-Benchmarks]
# Neither the faults nor the steps of the grid voltage of type B are tests of this version
PCS_RTE-I16z1 = SetPointStep,S_VolAngStep1,S_VolAngStep2,S_VolAngStep3,S_VolAngStep4,S_VolAngStep5,S_VolAngStep6,S_VolAngStep7,S_VolAngStep8,S_VolAngStep9,S_VolAngStep10,S_VolAngStep11,S_VolAngStep12,S_VolAmpStep1,S_VolAmpStep2,S_VolAmpStep3,S_VolAmpStep4,S_VolAmpStep5,S_VolAmpStep6,S_SCRup1,S_SCRdown1,S_Rocof1,S_Rocof2,S_Rocof3,S_Rocof4,S_Rocof5,S_Rocof6,S_Rocof7,S_Rocof8,S_Rocof9,S_Rocof10,S_Rocof11,S_Rocof12,S_Fault4,S_Fault5,S_Fault6

[PCS-OperatingConditions]
PCS_RTE-I16z1.S_VolAngStep1 = OC1,OC2,OC3,OC4,OC5
PCS_RTE-I16z1.S_VolAngStep2 = OC1,OC2,OC3,OC4,OC5
PCS_RTE-I16z1.S_VolAngStep3 = OC1,OC2,OC3,OC4,OC5
PCS_RTE-I16z1.S_VolAngStep4 = OC1,OC2,OC3,OC4,OC5
