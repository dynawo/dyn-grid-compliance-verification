[PCS_RTE-F16z3]
# Report name
report_name = report.RTE-F16z3.tex
# PCS Id, Used to sort the final report
id = 116
# PCS Zone
zone = 3
# Forces a change to Voltage-Droop mode, *regardless* of what the user has configured in Producer.PAR
# (Applies to all tests except QSetpoint type, generating units without Plant Controller or generating units with reactive power control activated)
force_voltage_droop = false
# Family of [GridCode] thresholds the fiche applies to the controlled magnitude of a setpoint
# step: thr_FT_reftrack_*, the errors tolerated against on-site measurements
setpoint_tracking_thresholds = FT

# The DTR Fiche F16 selects no test of its own: the producer proposes the on-site tests, RTE
# approves them and the recorded signals are the reference. The fiche only fixes the active
# power levels every test runs at (minimum, 50% of the maximum and maximum injection) and the
# errors it tolerates.
# The tests are therefore declared with their records: copy the declaration below into an
# F16Description.ini next to the reference curves of the case (<ReferenceCurves>/F16Description.ini),
# or complete the copy of this file that DyCoV leaves in templates/PCS/model/PPM/PCS_RTE-F16z3/
# of the configuration directory: remove the leading '#' of its lines, once per recorded test.
# The chapter 'The F16 declaration file' of the user manual explains every key, kind of test
# by kind of test (setpoint step, three-phase fault, voltage dip, voltage swell, frequency
# ramp, islanding), and the tutorial 'Declaring the on-site tests of PCS F16' walks through a
# declaration step by step.
[PCS-Benchmarks]
PCS_RTE-F16z3 =

