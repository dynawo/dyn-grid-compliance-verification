# Aliases of the tests of the DTR Fiche I18 (Grid Forming) that the Zone 1 of the Fiche I16.2,
# the version Type C/D of the Fiche I16, simulates: the settings each kind of test shares, and its
# operating points, taken at InternalNode1, the terminals of the unit. The Fiche I18 gives the
# active power of an operating point in pu of Pn, the rating of the converter that it takes as its
# base, and not of its Pmax: its example unit has an SNom of 100 MVA and a Pmax of 120 MW. The
# Fiche I16.2 and the Fiche I11 call Pn the maximum power of Zone 1 instead: a reading to confirm
# with RTE.
#
# There are three ways to define a PCS configuration section:
#
# 1. Standard definition (no inheritance):
#    All parameters are defined directly.
#    [MySection]
#    pdr_P = 0.5*Snom
#
# 2. Full inheritance:
#    The section only contains the 'inherit' key. All values are
#    loaded from the specified alias section.
#    [MySection]
#    inherit = MyAlias
#
# 3. Inheritance with override:
#    The section inherits from an alias but also defines specific
#    parameters. These local parameters will override the inherited ones.
#    [MySection]
#    inherit = MyAlias
#    SCR = 10  # This value overrides SCR from MyAlias

[I18ActiveCurrentTest]
# Tests 1, 3 and 4, a phase jump, a jump of the short-circuit ratio and a rate of change of
# frequency, whose response the Fiche I18 bounds with envelopes of the active current
report_name = report.I16z1.TypeCD.Test.tex
bolted_fault = false
hiz_fault = false
setpoint_change_test_type = Others
tracked_magnitude = active_current

[I18ReactiveCurrentTest]
# Test 2, a step of the grid voltage, whose response the Fiche I18 bounds with envelopes of the
# reactive current
report_name = report.I16z1.TypeCD.Test.tex
bolted_fault = false
hiz_fault = false
setpoint_change_test_type = Others
tracked_magnitude = reactive_current

[I18BoltedFaultTest]
# Test 5, a three-phase fault without impedance
report_name = report.I16z1.TypeCD.Test.tex
bolted_fault = true
hiz_fault = false
setpoint_change_test_type = Others

[I18HiZFaultTest]
# Test 5, a three-phase fault whose impedance leaves the residual voltage the test asks for
report_name = report.I16z1.TypeCD.Test.tex
bolted_fault = false
hiz_fault = true
setpoint_change_test_type = Others

[I18OC1]
# P = 0, Q = 0
pdr_P = 0
pdr_Q = 0
pdr_U = Unom

[I18OC2]
# P = 0.5 Pn, Q = 0
pdr_P = 0.5*Snom
pdr_Q = 0
pdr_U = Unom

[I18OC3]
# P = -0.5 Pn, Q = 0
pdr_P = -0.5*Snom
pdr_Q = 0
pdr_U = Unom

[I18OC4]
# P = 0.95 Pn, Q = 0
pdr_P = 0.95*Snom
pdr_Q = 0
pdr_U = Unom

[I18OC5]
# P = -0.95 Pn, Q = 0
pdr_P = -0.95*Snom
pdr_Q = 0
pdr_U = Unom

[I18OC6]
# P = 0, Q = -Qmax (absorption)
pdr_P = 0
pdr_Q = -Qmax
pdr_U = Unom

[I18OC7]
# P = 0, Q = Qmax (injection)
pdr_P = 0
pdr_Q = Qmax
pdr_U = Unom

[I18Event]
# Instant of time at which the event starts
sim_t_event_start = 20
