# Fiche I16.2 of the DTR, the version of the Fiche I16 for the storage installations of types C
# and D, which this revision splits from the Fiche I16.1 of type B. The type is the category the
# DTR gives the installation, from the connection voltage and the maximum power at injection of
# its Zone 3. It patches the description of the PCS, the one this revision gives type B: every
# section and key it leaves out is that of type B.

[PCS_RTE-I16z3]
# Report name
report_name = report.RTE-I16z3.TypeCD.tex

[GridCode]
# The fiche asks for a cut-off frequency of 30 Hz, given the response dynamics of Grid Forming
# units, and advises a common sampling interval of 1 ms
cutoff = 30.0
t_com = 0.001

[PCS-Benchmarks]
# The fiche repeats the step of the voltage setpoint of the Fiche I2, with the steps of the active
# and reactive power setpoints in its conditions, and the Fiches I6, I7 and I10, so the fault of
# the Fiche I5 is not a test of this version; nor is the ramp of the grid frequency, the case of
# Zone 1 that type B runs in Zone 3, which the Fiche I16.2 does not have
PCS_RTE-I16z3 = USetPointStep,PSetPointStep,QSetPointStep,GridVoltageDip,GridVoltageSwell,Islanding
