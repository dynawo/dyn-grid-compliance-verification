
name: Dev CI

on:
  pull_request:

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    name: Build OS ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Install uv and enable its cache
      - name: Install uv
        uses: astral-sh/setup-uv@v2

      # Install Python with uv
      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Create venv (uv will use it with `uv run`)
      - name: Create venv
        run: uv venv

      # Ensure pip exists in venv (cross-platform)
      - name: Ensure pip exists in venv
        run: |
          uv run python -m ensurepip --upgrade || true
          uv run python -m pip install --upgrade pip setuptools wheel

      # Install dev & test deps from your pyproject extras
      - name: Install dev & test dependencies
        run: uv pip install -e ".[dev,test]"

      # Ensure packaging toolchain (fix for `python -m build`)
      - name: Install build toolchain
        run: uv pip install --upgrade build setuptools wheel

      # Lint with Ruff (consistent with your pyproject.toml)
      - name: Lint with Ruff
        run: |
          uv run ruff --version
          uv run ruff check src tests --output-format=github

      # Check formatting with Ruff (consistent with your pyproject.toml)
      - name: Check format with Ruff
        run: uv run ruff format --check src tests

      # Build the wheel
      - name: Build package (wheel)
        run: uv run python -m build --wheel

      # Install the wheel (bash expands the glob)
      - name: Install wheel
        shell: bash
        run: uv pip install dist/*.whl

      # Run tests
      - name: Test
        run: uv run pytest -q --color=yes

           # Coverage (XML)
      - name: Coverage (XML)
        run: uv run pytest --cov=src --cov-report=xml