
name: Dev CI

on:
  pull_request:
  push:
    branches: [master]

concurrency:
  group: dev-ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: Build OS ${{ matrix.os }} with Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.13", "3.14"]
        os: [ubuntu-latest, macos-latest]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v10.4.0

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Create venv
        run: uv venv --python ${{ matrix.python-version }}

      # The tests run against the package as it is installed, so a file the wheel leaves out
      # fails them: build it, then install it with the extras the tests and the lint need, at
      # the versions uv.lock pins.
      - name: Build package (wheel)
        run: uv build --wheel

      - name: Install wheel
        shell: bash
        run: |
          uv export --locked --no-hashes --no-emit-project --all-extras --format requirements-txt \
            --quiet --output-file "$RUNNER_TEMP/constraints.txt"
          uv pip install --constraint "$RUNNER_TEMP/constraints.txt" "$(ls dist/*.whl)[dev,test]"

      - name: Show the interpreter and the package under test
        run: |
          uv run --no-sync python -VV
          uv run --no-sync python -c "import dycov; print(dycov.__file__)"

      - name: Lint with Ruff
        run: |
          uv run --no-sync ruff --version
          uv run --no-sync ruff check src tests --output-format=github

      - name: Check format with Ruff
        run: uv run --no-sync ruff format --check src tests

      # pytest.ini puts src on the path for local runs; here the tests import the installed
      # package instead, and measure its coverage in the same run.
      - name: Test
        run: uv run --no-sync pytest -q --color=yes -o pythonpath=. --cov=dycov --cov-report=xml
